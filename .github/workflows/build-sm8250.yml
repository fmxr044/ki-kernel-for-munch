name: Build munch (SM8250)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Root 变体'
        required: true
        default: 'nosusfs - ReSukiSU (无 SuSFS)'
        type: choice
        options:
          - 'both - 两个都编 (ReSukiSU 无 SuSFS + 无 Root)'
          - 'nosusfs - ReSukiSU (无 SuSFS)'
          - 'noksu - 无 Root'
      target_os:
        description: 'Target OS'
        required: true
        default: 'both - 通用双版本 (AOSP & MIUI/HyperOS)'
        type: choice
        options:
          - 'both - 通用双版本 (AOSP & MIUI/HyperOS)'
          - 'aosp - 仅 AOSP'
          - 'miui - 仅 MIUI / HyperOS'
      branch:
        description: '分支'
        required: true
        default: 'main'

jobs:
  setup:
    name: 准备构建矩阵
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.set-matrix.outputs.variants }}
      target_os: ${{ steps.set-matrix.outputs.target_os }}
    steps:
      - id: set-matrix
        run: |
          CHOSEN_VAR=$(echo "${{ inputs.variant }}" | awk '{print $1}')
          if [ "$CHOSEN_VAR" = "both" ]; then
            echo 'variants=["nosusfs","noksu"]' >> $GITHUB_OUTPUT
          else
            echo "variants=[\"$CHOSEN_VAR\"]" >> $GITHUB_OUTPUT
          fi

          CHOSEN_OS=$(echo "${{ inputs.target_os }}" | awk '{print $1}')
          echo "target_os=$CHOSEN_OS" >> $GITHUB_OUTPUT

  build:
    name: Build (munch - ${{ matrix.variant }})
    needs: setup
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.setup.outputs.variants) }}

    steps:
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean

      - name: 检出内核源码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: 准备外部模块 (BakaSU / NoMount / Baseband-guard)
        run: |
          rm -rf KernelSU
          git clone --depth=1 https://github.com/Baka-SU/BakaSU.git KernelSU
          if [ -f ".github/ci-patches/bakasu.patch" ]; then
            cd KernelSU
            git apply ../.github/ci-patches/bakasu.patch || echo "BakaSU patch applied with fallback"
            cd ..
          fi
          mkdir -p drivers
          ln -sf ../KernelSU/kernel drivers/kernelsu

          rm -rf NoMount
          git clone --depth=1 -b dev https://github.com/maxsteeel/nomount.git NoMount || \
          git clone --depth=1 https://github.com/maxsteeel/nomount.git NoMount
          mkdir -p fs
          ln -sf ../NoMount/kernel/src fs/nomount

          rm -rf Baseband-guard
          git clone --depth=1 https://github.com/vc-teahouse/Baseband-guard.git Baseband-guard
          mkdir -p security
          ln -sf ../Baseband-guard security/baseband-guard

      - name: 安装依赖与交叉工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            libssl-dev libelf-dev zip python3 python3-pip

      - name: 缓存 Clang 16
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: /home/runner/zyc-clang
          key: zyc-clang-16.0.6-20260807

      - name: 下载 Clang 16
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/zyc-clang
          cd $HOME/zyc-clang
          curl -fSL --retry 5 --retry-delay 5 --retry-all-errors https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz -o Clang.tar.gz
          tar -xf Clang.tar.gz
          rm -f Clang.tar.gz

      - name: 编译内核 (munch - ${{ matrix.variant }})
        run: |
          export PATH="$HOME/zyc-clang/bin:$PATH"
          chmod +x build.sh tools/hostcc
          bash build.sh munch ${{ matrix.variant }} ${{ needs.setup.outputs.target_os }}

      - name: 上传刷机包
        uses: actions/upload-artifact@v4
        with:
          name: Ki-Kernel-munch-${{ matrix.variant }}-${{ needs.setup.outputs.target_os }}-${{ github.run_number }}
          path: |
            *.zip
            release/*.zip
          if-no-files-found: error
